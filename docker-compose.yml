services:
  postgres:
    image: postgres:16
    container_name: agentic_commerce_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: agentic_user
      POSTGRES_PASSWORD: agentic_password
      POSTGRES_DB: agentic_commerce

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:  